  - info:
      name: Usuarios
      type: folder
      seq: 1
    request:
      auth: inherit
    items:
      - info:
          name: Autenticar usuário
          type: http
          seq: 2
          tags:
            - Usuarios
        http:
          method: POST
          url: '{{baseUrl}}/usuario/login'
          body:
            type: json
            data: |-
              {
                "email": "albert@example.com",
                "senha": "senha123"
              }
          auth: inherit
        runtime:
          scripts:
            - type: after-response
              code: |-
                // Verifica se a resposta foi 200 OK
                if (res.getStatus() === 200) {
                  // Pega o token do corpo da resposta (ajuste o caminho 'token' conforme o seu JSON)
                  const token = res.getBody().token; 
                  
                  // Salva o token em uma variável de ambiente da Collection
                  bru.setEnvVar("bearerToken", token);
                  
                  console.log("Token atualizado com sucesso! ");
                }
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
        examples:
          - name: 200 Response (default)
            description: Autenticação realizada com sucesso
            request:
              url: '{{baseUrl}}/usuario/login'
              method: POST
              body:
                type: json
                data: |-
                  {
                    "email": "joao.silva@exemplo.com",
                    "senha": "senhaForte123"
                  }
            response:
              status: 200
              statusText: OK
              headers:
                - name: Content-Type
                  value: application/json
              body:
                type: json
                data: |-
                  {
                    "Nome": "",
                    "Token": ""
                  }
          - name: 400 Response (default)
            description: Usuário ou senha inválidos
            request:
              url: '{{baseUrl}}/usuario/login'
              method: POST
              body:
                type: json
                data: |-
                  {
                    "email": "joao.silva@exemplo.com",
                    "senha": "senhaForte123"
                  }
            response:
              status: 400
              statusText: Bad Request
              body:
                type: text
                data: ''
